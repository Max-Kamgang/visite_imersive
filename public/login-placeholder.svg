<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="MUSEA heritage motif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="0.5" stop-color="#3a2617"/>
      <stop offset="1" stop-color="#5f2f11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#f26b21" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f26b21" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diamonds" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M43 9 L77 43 L43 77 L9 43 Z" fill="none" stroke="#cda24e" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="43" cy="43" r="3.5" fill="#cda24e" fill-opacity="0.13"/>
    </pattern>
    <pattern id="tri" width="64" height="46" patternUnits="userSpaceOnUse">
      <path d="M0 46 L32 4 L64 46 Z" fill="none" stroke="#cda24e" stroke-opacity="0.28" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#diamonds)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>

  <!-- Emblème soleil / bouclier -->
  <g transform="translate(450 360)" stroke="#cda24e" fill="none">
    <circle r="128" stroke-width="2" stroke-opacity="0.38"/>
    <circle r="96" stroke-width="1.5" stroke-opacity="0.26"/>
    <circle r="150" stroke-width="1" stroke-opacity="0.16"/>
    <g stroke-width="2" stroke-opacity="0.42">
      <line x1="0" y1="-128" x2="0" y2="-158"/>
      <line x1="64" y1="-110.9" x2="79" y2="-136.8"/>
      <line x1="110.9" y1="-64" x2="136.8" y2="-79"/>
      <line x1="128" y1="0" x2="158" y2="0"/>
      <line x1="110.9" y1="64" x2="136.8" y2="79"/>
      <line x1="64" y1="110.9" x2="79" y2="136.8"/>
      <line x1="0" y1="128" x2="0" y2="158"/>
      <line x1="-64" y1="110.9" x2="-79" y2="136.8"/>
      <line x1="-110.9" y1="64" x2="-136.8" y2="79"/>
      <line x1="-128" y1="0" x2="-158" y2="0"/>
      <line x1="-110.9" y1="-64" x2="-136.8" y2="-79"/>
      <line x1="-64" y1="-110.9" x2="-79" y2="-136.8"/>
    </g>
    <circle r="30" fill="#cda24e" fill-opacity="0.16" stroke="none"/>
  </g>

  <!-- Bandes décoratives basses (kente / bogolan) -->
  <rect x="0" y="900" width="900" height="6" fill="#cda24e" fill-opacity="0.22"/>
  <rect x="0" y="916" width="900" height="150" fill="url(#tri)"/>
  <rect x="0" y="1078" width="900" height="6" fill="#cda24e" fill-opacity="0.22"/>
</svg>
